name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Permite temporariamente que a ação antiga do compilador GCC (fiam) corra no ecossistema moderno
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      # Mantido o suporte a comandos antigos do repositório original do SmartESC
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: log untrusted output
      run: |
        # disable command workflow processing
        echo "::stop-commands::`echo -n ${{ github.token }} | sha256sum | head -c 64`"

        # log untrusted output
        echo "untrusted output"

        # enable workflow command processing
        echo "::`echo -n ${{ github.token }} | sha256sum | head -c 64`::"

    - name: arm-none-eabi-gcc
      uses: fiam/arm-none-eabi-gcc@v1.0.2
      with:
        release: '9-2020-q2'

    - name: make
      run: make
      
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        architecture: 'x64'

    - run: python tools/xiaotea/Scripts/prepareZip_online.py      

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        path: ${{ github.workspace }}/tools/zip_output
        name: M365_v3_build_${{ github.run_number }}
        retention-days: 5
